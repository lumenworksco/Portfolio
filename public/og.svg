<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <!-- Aurora blobs -->
    <radialGradient id="a1" cx="25%" cy="35%" r="55%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="75%" cy="65%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="55%" cy="15%" r="40%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>

    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="40%"  stop-color="#8b5cf6"/>
      <stop offset="60%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Subtle noise / grain texture -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Aurora layers -->
  <rect width="1200" height="630" fill="url(#a1)"/>
  <rect width="1200" height="630" fill="url(#a2)"/>
  <rect width="1200" height="630" fill="url(#a3)"/>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0"    y1="210" x2="1200" y2="210"/>
    <line x1="0"    y1="420" x2="1200" y2="420"/>
    <line x1="400"  y1="0"   x2="400"  y2="630"/>
    <line x1="800"  y1="0"   x2="800"  y2="630"/>
  </g>

  <!-- Accent line above name -->
  <rect x="560" y="228" width="80" height="2" rx="1" fill="#8b5cf6" opacity="0.7"/>

  <!-- Name -->
  <text
    x="600" y="320"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="82"
    font-weight="700"
    letter-spacing="-2"
    fill="url(#nameGrad)"
  >Florian Braun</text>

  <!-- Tagline -->
  <text
    x="600" y="375"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="400"
    fill="rgba(255,255,255,0.45)"
  >Exploring the Intersection of AI &amp; Entrepreneurship</text>

  <!-- Sub-tagline -->
  <text
    x="600" y="410"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="16"
    font-weight="400"
    fill="rgba(255,255,255,0.22)"
  >Aspiring Researcher in LLMs and NLP · Leuven, Belgium</text>

  <!-- Accent line below tagline -->
  <rect x="560" y="432" width="80" height="2" rx="1" fill="#8b5cf6" opacity="0.35"/>

  <!-- Three dots / Pokéball-style type indicators -->
  <circle cx="572" cy="470" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="600" cy="470" r="5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="628" cy="470" r="5" fill="#10b981" opacity="0.8"/>

  <!-- URL -->
  <text
    x="600" y="568"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="15"
    letter-spacing="5"
    fill="rgba(255,255,255,0.2)"
  >braunf.com</text>

  <!-- Border frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" ry="16"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
</svg>
